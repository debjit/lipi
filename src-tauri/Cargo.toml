[package]
name = "lipi"
version = "0.1.8"
description = "Lipi - Local voice transcription and notes"
authors = ["Debjit Biswas <debjit012@gmail.com>"]
license = "AGPL-3.0-only"
homepage = "https://lipi.debjit.in"
repository = "https://github.com/debjit/lipi"
readme = "../README.md"
keywords = ["dictation", "speech-to-text", "whisper", "tauri"]
categories = ["gui", "multimedia::audio"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lipi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
serde_json = "1"
cpal = "0.15"
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
rusqlite = { version = "0.33", features = ["bundled"] }
arboard = "3"
enigo = "0.2"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "ndarray"] }
ndarray = "0.16"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }
gio = "0.18"
glib = "0.18"
libpulse-binding = "2.30"

[target.'cfg(target_os = "macos")'.dependencies]
rfd = "0.15"
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSUUID", "NSValue"] }
objc2-core-audio = { version = "0.3", features = ["objc2-foundation"] }
objc2-core-audio-types = "0.3"

[target.'cfg(windows)'.dependencies]
rfd = "0.15"
wasapi = "0.26"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_Graphics_Dwm"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
